nn_arch:
  - layer_neurons: 257 # input neurons

  - layer_type: conv1d # layer 0
    filters: 72
    kernel_size: 6
    dropout: 0.1
    activation: relu
    layer_neurons: 257

  - layer_type: lstm # layer 1
    layer_neurons: 72
    dropout: 0.25
    activation: tanh

  - layer_type: fc # layer 2
    layer_neurons: 72
    activation: tanh
    dropout: 0.25

  - layer_type: fc # layer 3
    layer_neurons: 72
    activation: tanh
    dropout: 0.25

  - layer_type: fc # layer 4
    layer_neurons: 72
    activation: sigmoid
    dropout: 0.25

feat:
  type: 'pspec'
  num_lookahead: 0  # if !=0, it is non-causal